name: Continuous integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend compile and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api
      MOCK_AUTH: "true"
      ENVIRONMENT: development
      LLM_API_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            experiments/controlled_qa/requirements-inference.txt
      - name: Install backend and recorded test runtime dependencies
        run: |
          python -m pip install -r apps/api/requirements.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          # Both dependencies already belong to the captured research runtime.
          # Do not install its entire workstation-specific dependency snapshot.
          lines = Path("experiments/controlled_qa/requirements-inference.txt").read_text().splitlines()
          requirements = [line for line in lines if line.startswith(("aiosqlite==", "en_core_web_sm @ "))]
          if len(requirements) != 2:
              raise SystemExit("Expected recorded SQLite driver and spaCy model requirements")
          subprocess.run([sys.executable, "-m", "pip", "install", *requirements], check=True)
          PY
      - name: Compile backend Python sources
        run: python -m compileall -q apps/api
      - name: Run offline backend tests in an isolated directory
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/backend-tests/akgb.db
          CHROMA_PATH: ${{ runner.temp }}/backend-tests/chroma
        run: |
          mkdir -p "$RUNNER_TEMP/backend-tests"
          cd "$RUNNER_TEMP/backend-tests"
          # Development settings force ./akgb.db; the isolated cwd also prevents
          # loading the application's real .env or modifying a checkout database.
          # These two legacy scripts require a separately managed live server;
          # test_integration_quick.py even sends HTTP requests during import.
          python -m pytest "$GITHUB_WORKSPACE/apps/api/tests" -q \
            --ignore="$GITHUB_WORKSPACE/apps/api/tests/test_integration.py" \
            --ignore="$GITHUB_WORKSPACE/apps/api/tests/test_integration_quick.py" \
            --junitxml="$RUNNER_TEMP/backend-tests/pytest.xml"
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/backend-tests/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_MOCK_AUTH: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: |
          mkdir -p reports
          npm run lint 2>&1 | tee reports/lint.txt
      - name: Check TypeScript
        run: npm run typecheck 2>&1 | tee reports/typecheck.txt
      - name: Run frontend unit tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=reports/vitest.xml
      - name: Build production frontend
        env:
          # Production deliberately rejects the development mock-auth flag.
          NEXT_PUBLIC_MOCK_AUTH: "false"
        run: npm run build 2>&1 | tee reports/build.txt
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-check-results
          path: apps/web/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload frontend build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          include-hidden-files: true
          path: |
            apps/web/.next/
            !apps/web/.next/cache/**
          if-no-files-found: error
          retention-days: 7

  research-reproduction:
    name: Offline research reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit frozen artifacts
        run: python experiments/controlled_qa/reproduce.py audit
      - name: Run offline reproduction regression tests
        run: python -m unittest discover -s experiments/controlled_qa -p test_reproduce.py -v
      - name: Run benchmark generator regression tests
        run: python -m unittest discover -s apps/api/scripts -p test_research_benchmark.py -v
